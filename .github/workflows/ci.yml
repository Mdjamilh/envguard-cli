name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [oldstable, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      # bash on every OS: PowerShell splits "-coverprofile=coverage.out" at the dot.
      - run: go test -race -coverprofile=coverage.out ./...
        shell: bash
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go tool cover -func=coverage.out | tail -1

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go test ./internal/dotenv -run '^$' -fuzz FuzzParse -fuzztime 60s

  # envguard checks its own example and scans this repository on every push.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          command: check
          args: --env examples/sample.env --schema examples/.env.example
      - uses: ./
        with:
          command: scan
